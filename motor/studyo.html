<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renk Dalgası Stüdyo</title>
<style>
:root{--z:#0e2028;--y:#16303a;--c:#25505a;--m:#fff3dc;--s:#a9c3c2;--v:#ffb02e}
*{box-sizing:border-box}body{margin:0;background:var(--z);color:var(--m);font:15px/1.45 "Segoe UI",sans-serif}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--y);flex-wrap:wrap}header b{font-size:18px;margin-right:10px}
button,select,input,textarea{font:inherit;color:inherit;background:#0b1a21;border:1px solid var(--c);border-radius:8px;padding:6px 10px;min-width:0}
button{cursor:pointer;background:var(--c)}button:hover{filter:brightness(1.2)}button.ana{background:var(--v);color:#20140a;border-color:var(--v);font-weight:700}button[aria-pressed=true]{outline:2px solid var(--v)}:focus-visible{outline:2px solid #fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;padding:14px}@media(max-width:1000px){main{grid-template-columns:1fr}}
canvas#sahne{width:100%;border-radius:12px;display:block;background:#000;touch-action:none}.panel{background:var(--y);border-radius:12px;padding:14px;max-height:calc(100vh - 90px);overflow:auto}
label{display:grid;grid-template-columns:112px 1fr;gap:8px;align-items:center;margin:6px 0}label>*{width:100%}input[type=color]{height:34px;padding:2px}h3{margin:14px 0 4px;font-size:14px;color:var(--v)}
.sira{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.sira button{padding:4px 9px;font-size:13px}#zaman{width:100%;accent-color:var(--v)}#durum{margin-left:auto;color:var(--s)}ul{margin:4px 0;padding-left:18px}.h{color:#ff9d8f}.u{color:#ffd27a}.g{color:#9fe0b8}.rep{border-top:1px solid var(--c);padding-top:6px;margin-top:8px}[hidden]{display:none!important}
</style>
<header><b>Renk Dalgası</b><button id="sKadro" aria-pressed="true">Karakter atölyesi</button><button id="sFilm" aria-pressed="false">Film masası</button><select id="filmSec" aria-label="Film" hidden></select><button id="geri">Geri al</button><button id="kaydet" class="ana">Kaydet</button><span id="durum" role="status"></span></header>
<main><section><canvas id="sahne" width="1920" height="1080"></canvas><div id="alt"></div></section><aside class="panel" id="panel"></aside></main>
<script type="module" src="/motor/studyo.js"></script></html>
